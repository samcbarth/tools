<div class="field"><label for="t-in">Timestamp or date <span class="hint">(Unix seconds, milliseconds, ISO 8601, or a date like 2026-11-09 14:30)</span></label>
<input id="t-in" type="text" class="mono" value="1794268800"></div>
<div class="btns"><button class="btn secondary" id="t-now" type="button">Use current time</button></div>
<div id="t-status" class="status"></div>
<div class="table-wrap"><table><tbody id="t-out"></tbody></table></div>
<h3>Build a timestamp from a date</h3>
<div class="row">
<div><label for="t-local">Date and time</label><input id="t-local" type="datetime-local" step="1"></div>
<div><label for="t-zone">Interpret as</label><select id="t-zone"><option value="local">My time zone</option><option value="utc">UTC</option></select></div>
</div>
<div id="t-built" class="out"></div>
