<button class="btn secondary" type="button" data-case="lower">lowercase</button>
<button class="btn secondary" type="button" data-case="camel">camelCase</button>
<button class="btn secondary" type="button" data-case="pascal">PascalCase</button>
<button class="btn secondary" type="button" data-case="snake">snake_case</button>
<button class="btn secondary" type="button" data-case="kebab">kebab-case</button>
