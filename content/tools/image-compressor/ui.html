<label class="drop" id="i-drop" for="i-file">Drop images here or click to choose (JPG, PNG, WebP, GIF first frame)
<input id="i-file" type="file" accept="image/*" multiple hidden></label>
<div class="row" style="margin-top:12px">
<div><label for="i-fmt">Output format</label><select id="i-fmt"><option value="image/webp">WebP</option><option value="image/jpeg">JPEG</option><option value="image/png">PNG (lossless)</option></select></div>
<div><label for="i-q">Quality <span class="hint" id="i-qv">80</span></label><input id="i-q" type="range" min="10" max="100" value="80"></div>
<div><label for="i-w">Max width in pixels <span class="hint">(0 keeps size)</span></label><input id="i-w" type="number" min="0" value="1600"></div>
</div>
<div id="i-status" class="status"></div>
<div id="i-list"></div>
<div class="btns"><button class="btn secondary" id="i-all" type="button" disabled>Download all</button></div>
