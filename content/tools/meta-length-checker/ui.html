<div class="field"><label for="m-title">Title tag</label>
<input id="m-title" type="text" value="Free Meta Title and Description Length Checker"></div>
<div class="meter" aria-hidden="true"><i id="m-tbar"></i></div>
<div class="status" id="m-tstat"></div>
<div class="field"><label for="m-desc">Meta description</label>
<textarea id="m-desc" style="min-height:90px">Check your title tag and meta description length in characters and pixels, and preview how the snippet may look in search results.</textarea></div>
<div class="meter" aria-hidden="true"><i id="m-dbar"></i></div>
<div class="status" id="m-dstat"></div>
<div class="field"><label for="m-url">Page URL <span class="hint">(optional, for the preview)</span></label>
<input id="m-url" type="url" value="https://example.com/tools/meta-length-checker/"></div>
<h3>Search result preview</h3>
<div class="serp"><div class="s-url" id="m-purl"></div><div class="s-title" id="m-ptitle"></div><div class="s-desc" id="m-pdesc"></div></div>
<p class="hint">Search engines rewrite snippets often and truncate by pixel width, not characters. Treat this as a guide.</p>
